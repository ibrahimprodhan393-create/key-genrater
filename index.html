<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Random Key Admin Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="brand-bar" aria-label="Application header">
        <div class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
        <div>
          <p class="eyebrow">Admin Console</p>
          <h1>Random Key Generator</h1>
        </div>
        <p class="system-pill" id="sessionState">Locked</p>
      </header>

      <main>
        <section class="login-view" id="loginView">
          <form class="login-panel" id="loginForm" autocomplete="off">
            <div class="panel-heading">
              <p class="eyebrow">Secure Entry</p>
              <h2>Admin Login</h2>
            </div>

            <label class="field">
              <span>Password</span>
              <input id="adminPassword" type="password" placeholder="Admin password" required>
            </label>

            <button class="primary-button" type="submit">Login</button>
            <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="admin-view hidden" id="adminView" aria-hidden="true">
          <aside class="side-rail">
            <div class="side-title">
              <p class="eyebrow">Control Room</p>
              <h2>Code Panel</h2>
            </div>

            <div class="stat-stack">
              <div class="stat-box">
                <span>Random Length</span>
                <strong id="lengthStat">5</strong>
              </div>
              <div class="stat-box">
                <span>Batch</span>
                <strong id="batchStat">4</strong>
              </div>
              <div class="stat-box">
                <span>Pool</span>
                <strong id="poolStat">0</strong>
              </div>
            </div>

            <button class="ghost-button" id="generateSideButton" type="button">Generate</button>
            <button class="danger-button" id="logoutButton" type="button">Logout</button>
          </aside>

          <div class="work-area">
            <section class="tool-panel generator-panel" aria-labelledby="generatorTitle">
              <div class="panel-heading wide-heading">
                <div>
                  <p class="eyebrow">Builder</p>
                  <h2 id="generatorTitle">Create Passwords or Codes</h2>
                </div>
                <button class="icon-button" id="resetButton" type="button" title="Reset settings" aria-label="Reset settings">R</button>
              </div>

              <form id="generatorForm" class="generator-grid">
                <label class="field">
                  <span>Prefix</span>
                  <input id="prefixInput" type="text" placeholder="Example: VIP-">
                </label>

                <label class="field">
                  <span>Day / Middle Segment</span>
                  <input id="middleInput" type="text" placeholder="Example: 7DAY-">
                </label>

                <label class="field">
                  <span>Suffix</span>
                  <input id="suffixInput" type="text" placeholder="Example: -BD">
                </label>

                <label class="field">
                  <span>Random Length</span>
                  <input id="lengthInput" type="number" min="1" max="128" value="5">
                </label>

                <label class="field">
                  <span>Quantity</span>
                  <input id="quantityInput" type="number" min="1" max="100" value="4">
                </label>

                <label class="field day-options-field">
                  <span>Random Day Options</span>
                  <textarea id="dayOptionsInput" rows="2" placeholder="1DAY-,5DAY-,7DAY-,10DAY-,30DAY-"></textarea>
                </label>

                <div class="day-preset-row" aria-label="Day presets">
                  <button type="button" class="day-preset-button" data-day="1DAY-">1DAY</button>
                  <button type="button" class="day-preset-button" data-day="5DAY-">5DAY</button>
                  <button type="button" class="day-preset-button" data-day="7DAY-">7DAY</button>
                  <button type="button" class="day-preset-button" data-day="10DAY-">10DAY</button>
                  <button type="button" class="day-preset-button" data-day="30DAY-">30DAY</button>
                </div>

                <div class="preset-row" aria-label="Length presets">
                  <button type="button" class="preset-button" data-length="3">3</button>
                  <button type="button" class="preset-button is-active" data-length="5">5</button>
                  <button type="button" class="preset-button" data-length="7">7</button>
                  <button type="button" class="preset-button" data-length="8">8</button>
                  <button type="button" class="preset-button" data-length="10">10</button>
                  <button type="button" class="preset-button" data-length="16">16</button>
                </div>

                <fieldset class="option-panel">
                  <legend>Character Types</legend>
                  <label class="check-tile">
                    <input type="checkbox" data-pool="letters" checked>
                    <span>Letters</span>
                  </label>
                  <label class="check-tile">
                    <input type="checkbox" data-pool="numbers" checked>
                    <span>Numbers</span>
                  </label>
                  <label class="check-tile">
                    <input type="checkbox" data-pool="symbols">
                    <span>Symbols</span>
                  </label>
                  <label class="check-tile">
                    <input type="checkbox" data-pool="arrows">
                    <span>Arrows</span>
                  </label>
                </fieldset>

                <fieldset class="option-panel">
                  <legend>Rules</legend>
                  <label class="check-tile">
                    <input id="avoidSimilarInput" type="checkbox" checked>
                    <span>Avoid Similar</span>
                  </label>
                  <label class="check-tile">
                    <input id="mustIncludeInput" type="checkbox" checked>
                    <span>Require Each Type</span>
                  </label>
                  <label class="check-tile">
                    <input id="uppercaseInput" type="checkbox">
                    <span>Uppercase Random</span>
                  </label>
                  <label class="check-tile">
                    <input id="randomDayInput" type="checkbox" checked>
                    <span>Random Day Option</span>
                  </label>
                </fieldset>

                <label class="field custom-field">
                  <span>Custom Characters</span>
                  <textarea id="customInput" rows="3" placeholder="Example: ABC789 or @#%"></textarea>
                </label>

                <div class="action-row">
                  <button class="primary-button" type="submit">Generate Code</button>
                  <button class="ghost-button" id="copyAllButton" type="button">Copy All</button>
                </div>

                <p class="form-message generator-message" id="generatorMessage" role="status" aria-live="polite"></p>
              </form>
            </section>

            <section class="tool-panel result-panel" aria-labelledby="resultTitle">
              <div class="panel-heading wide-heading">
                <div>
                  <p class="eyebrow">Viewer</p>
                  <h2 id="resultTitle">Corner Frame Results</h2>
                </div>
                <button class="icon-button" id="clearButton" type="button" title="Clear results" aria-label="Clear results">X</button>
              </div>

              <div class="result-grid" id="resultGrid" aria-live="polite"></div>
              <p class="empty-state" id="emptyState">No codes generated yet.</p>
            </section>

            <section class="tool-panel history-panel" aria-labelledby="historyTitle">
              <div class="panel-heading wide-heading">
                <div>
                  <p class="eyebrow">History</p>
                  <h2 id="historyTitle">Recent Batches</h2>
                </div>
                <button class="icon-button" id="clearHistoryButton" type="button" title="Clear history" aria-label="Clear history">C</button>
              </div>
              <div class="history-list" id="historyList"></div>
            </section>

            <section class="tool-panel password-panel" aria-labelledby="passwordTitle">
              <div class="panel-heading">
                <p class="eyebrow">Access</p>
                <h2 id="passwordTitle">Change Admin Password</h2>
              </div>
              <form id="passwordForm" class="password-form">
                <label class="field">
                  <span>Current Password</span>
                  <input id="currentPasswordInput" type="password" autocomplete="current-password">
                </label>
                <label class="field">
                  <span>New Password</span>
                  <input id="newPasswordInput" type="password" autocomplete="new-password" minlength="4">
                </label>
                <button class="ghost-button" type="submit">Save</button>
                <p class="form-message" id="passwordMessage" role="status" aria-live="polite"></p>
              </form>
            </section>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
